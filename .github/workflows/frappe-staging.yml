#nEW SET
name: Frappe CI/CD – Staging

on:
  push:
    branches:
      - staging   # change if you want staging branch
  workflow_dispatch:   # allows manual trigger too

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Basic sanity check
        run: |
          echo "CI step passed"
          # You can add lint/tests later

  deploy:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest

    # 🔐 THIS is what triggers approval
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: frappe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "🔹 Switching to bench directory"
            cd /home/frappe/frappe-bench

            echo "🔹 Loading frappe environment"
            source /home/frappe/.bashrc

            echo "🔹 Verifying bench"
            which bench
            bench --version

            echo "🔹 Pulling latest code"
            git pull origin main

            echo "🔹 Running migrations"
            bench migrate

            echo "🔹 Restarting services"
            bench restart

            echo "✅ Deployment completed successfully"
