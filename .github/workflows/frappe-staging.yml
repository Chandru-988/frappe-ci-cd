name: Frappe CI/CD - Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo (for trigger only)
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Deploy to Frappe Server
      run: |
        ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
          set -e
          cd ${{ secrets.BENCH_PATH }}

          echo "=== Updating Frappe App ==="
          bench update --apps ${{ secrets.FRAPPE_APP }} --no-backup

          echo "=== Running Migrations ==="
          bench migrate

          echo "=== Restarting Bench ==="
          bench restart

          echo "=== Deployment Completed Successfully ==="
        EOF
